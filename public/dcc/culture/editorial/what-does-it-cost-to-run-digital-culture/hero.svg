<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" width="1672" height="941" role="img" aria-label="A luminous, playful digital sculpture above a massive layered support system hidden below the surface">
<defs>
  <radialGradient id="bg" cx="68%" cy="38%" r="80%"><stop offset="0" stop-color="#0b3038"/><stop offset=".34" stop-color="#061e24"/><stop offset=".73" stop-color="#031518"/><stop offset="1" stop-color="#010a0e"/></radialGradient>
  <radialGradient id="haze"><stop stop-color="#0c8b95" stop-opacity=".3"/><stop offset="1" stop-color="#0c8b95" stop-opacity="0"/></radialGradient>
  <linearGradient id="top" x1="0" x2=".9" y1="0" y2="1"><stop stop-color="#254852"/><stop offset=".5" stop-color="#102d35"/><stop offset="1" stop-color="#061a20"/></linearGradient>
  <linearGradient id="face" x1="0" y1=".1" x2=".9" y2=".95"><stop stop-color="#1b4149"/><stop offset=".6" stop-color="#09262d"/><stop offset="1" stop-color="#051419"/></linearGradient>
  <linearGradient id="side" x1="0" y1="0" x2="1" y2=".7"><stop stop-color="#07191e"/><stop offset=".45" stop-color="#0d3038"/><stop offset="1" stop-color="#07161b"/></linearGradient>
  <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6dcdd0"/><stop offset=".22" stop-color="#234d55"/><stop offset=".68" stop-color="#09262e"/><stop offset="1" stop-color="#2a6a70"/></linearGradient>
  <linearGradient id="cable" x1="0" y1="0" x2="1" y2=".2"><stop stop-color="#46d5ce"/><stop offset=".52" stop-color="#087682"/><stop offset="1" stop-color="#021e23"/></linearGradient>
  <linearGradient id="warm" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffe0a0"/><stop offset=".35" stop-color="#f7a15f"/><stop offset="1" stop-color="#bd523d"/></linearGradient>
  <radialGradient id="glass" cx="36%" cy="22%" r="75%"><stop stop-color="#d2fff4"/><stop offset=".17" stop-color="#b1fce6"/><stop offset=".42" stop-color="#59d9cf"/><stop offset=".78" stop-color="#078b9b"/><stop offset="1" stop-color="#00404c"/></radialGradient>
  <linearGradient id="shimmer" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#73faed"/><stop offset=".45" stop-color="#97aaff"/><stop offset=".7" stop-color="#e3a5df"/><stop offset="1" stop-color="#ffbf79"/></linearGradient>
