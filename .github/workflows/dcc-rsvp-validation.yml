name: DCC RSVP release validation

on:
  pull_request:
    paths:
      - 'app/api/events/fiu-ratcliffe/**'
      - 'app/api/cron/dcc-event-mail/**'
      - 'app/(marketing)/events/fiu-ratcliffe-2026-11-10/**'
      - 'lib/dcc/events/**'
      - 'supabase/migrations/*dcc_event*'
      - 'vercel.json'
      - '.github/workflows/dcc-rsvp-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: TypeScript validation
        run: npm run type-check
      - name: Next.js production build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci
          CLERK_SECRET_KEY: clerk_ci_placeholder
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-key
          RESEND_API_KEY: re_ci_placeholder
        run: npm run build
