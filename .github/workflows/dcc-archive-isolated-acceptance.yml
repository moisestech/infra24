name: DCC archive isolated PostgreSQL acceptance

on:
  pull_request:
    branches: ['feat/dcc-private-archive-phase1-20261126']

permissions:
  contents: read

jobs:
  archive-postgres:
    if: github.head_ref == 'feat/dcc-private-archive-postgres-acceptance-20261126'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17.4
        env:
          POSTGRES_DB: dcc_archive_test
          POSTGRES_PASSWORD: archive-test-only
        options: >-
          --health-cmd "pg_isready -U postgres -d dcc_archive_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Offline regression
        run: |
          python3 scripts/dcc/private-archive-rehearsal.py
          python3 scripts/dcc/commercial-integrity-rehearsal.py
      - name: Disposable PostgreSQL acceptance
        env:
          DCC_ARCHIVE_TEST_CONTAINER: ${{ job.services.postgres.id }}
        run: python3 scripts/dcc/private-archive-postgres-acceptance.py
