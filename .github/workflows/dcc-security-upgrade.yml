name: DCC pinned security candidate (Node 22)
on:
  push:
    branches: ['security/dcc-dependency-remediation-20261126']
permissions:
  contents: read
concurrency:
  group: dcc-security-pinned-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  resolve-fonts:
    name: Resolve only self-hosted font dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Produce exact manifest and lockfile
        run: |
          set -euo pipefail
          if ! node -e "const p=require('./package.json'); if(!p.dependencies['@fontsource-variable/space-grotesk'] || !p.dependencies['@fontsource/ibm-plex-mono']) process.exit(1)"; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund --save-exact @fontsource-variable/space-grotesk@5 @fontsource/ibm-plex-mono@5
          fi
          mkdir -p resolved
          cp package.json package-lock.json resolved/
          sha256sum package.json package-lock.json > resolved/sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: resolved-font-lock
          path: resolved/
  persist-fonts:
    name: Commit resolved font dependencies (no dependency execution)
    needs: resolve-fonts
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/security/dcc-dependency-remediation-20261126' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: resolved-font-lock
          path: resolved
      - name: Verify and persist only manifest and lock
        run: |
          set -euo pipefail
          cp resolved/package.json resolved/package-lock.json .
          sha256sum -c resolved/sha256.txt
          git add -- package.json package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='DCC dependency CI' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build: pin self-hosted DCC font packages'
          git push origin HEAD:refs/heads/security/dcc-dependency-remediation-20261126
  audit:
    needs: resolve-fonts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: resolved-font-lock
          path: resolved
      - name: Verify exact candidate lock
        run: |
          cp resolved/package.json resolved/package-lock.json .
          sha256sum -c resolved/sha256.txt
      - name: Audit exact candidate lockfile (no dependency execution)
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/commit.txt
          sha256sum package-lock.json > evidence/lockfile.sha256
          npm audit --package-lock-only --omit=dev --json > evidence/production.json || true
          node -e "const r=require('./evidence/production.json'); if(r.error || !r.metadata?.vulnerabilities || !r.vulnerabilities) throw Error('Audit unavailable'); console.log(JSON.stringify(r.metadata.vulnerabilities)); for(const v of Object.values(r.vulnerabilities)) console.log(JSON.stringify({name:v.name,severity:v.severity,fix:v.fixAvailable})); if(r.metadata.vulnerabilities.high || r.metadata.vulnerabilities.critical) process.exit(1)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pinned-production-audit
          path: evidence/
          retention-days: 14
  validate:
    needs: resolve-fonts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: resolved-font-lock
          path: resolved
      - name: Verify exact candidate lock
        run: |
          cp resolved/package.json resolved/package-lock.json .
          sha256sum -c resolved/sha256.txt
      - name: Install exact dependencies
        id: install
        run: npm ci
      - run: npm run secret-scan && npm run type-check
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - run: npm run lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: npm test -- --runInBand
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: npm run build
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          CIRCLE_NODE_TOTAL: '2'
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsucHJldmlldy5leGFtcGxlJA
          CLERK_SECRET_KEY: local-dummy
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:65432
          NEXT_PUBLIC_SUPABASE_ANON_KEY: local-placeholder
          SUPABASE_SERVICE_ROLE_KEY: local-placeholder
          RESEND_API_KEY: re_local_only
      - name: Type check generated Next route contracts
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run type-check
        env:
          NODE_OPTIONS: --max-old-space-size=4096
