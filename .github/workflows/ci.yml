name: CI

on:
  push:
    branches: [main, develop, 'career/**']
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  dcc-mvp:
    name: DCC Passport security and publication regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: DCC focused Jest tests
        run: |
          npx jest --runInBand --ci \
            __tests__/lib/dcc-membership-clerk-event.test.ts \
            __tests__/lib/dcc-membership-lifecycle.test.ts \
            __tests__/lib/dcc-passport-owner.test.ts \
            __tests__/lib/dcc-steward-review.test.ts \
            __tests__/lib/dcc-founder-identity.test.ts \
            __tests__/lib/dcc-steward-identity-queue.test.ts \
            __tests__/lib/dcc-steward-publication.test.ts \
            __tests__/lib/dcc-steward-publication-service.test.ts \
            __tests__/lib/dcc-steward-decision-route.test.ts \
            __tests__/lib/dcc-atlas-intake.test.ts \
            __tests__/lib/dcc-atlas-publication-grant.test.ts \
            __tests__/lib/dcc-sculpture-public.test.ts \
            __tests__/lib/dcc-sculpture-profiles.test.ts \
            __tests__/lib/dcc-auth-return-path.test.ts

  dcc-sql:
    name: DCC owner publication database regression
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: dcc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dcc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Run isolated migration and rollback-only regression
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: local-ci-only
          PGDATABASE: dcc_test
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -c 'CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN; CREATE ROLE service_role NOLOGIN;'
          for migration in \
            supabase/migrations/20261124130727_dcc_platform_member_event_ledger_20261122220000.sql \
            supabase/migrations/20261124130801_dcc_private_profile_and_sculpture_snapshots_20261122233000.sql \
            supabase/migrations/20261124130802_dcc_member_reconciliation_queue_20261122235000.sql \
            supabase/migrations/20261125205617_dcc_steward_publication_grants_20261125214000.sql \
            supabase/migrations/20261126021500_dcc_owner_passport_revision_cas.sql \
            supabase/migrations/20261126110000_dcc_founder_identity_review.sql
          do
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done
          psql -v ON_ERROR_STOP=1 -f supabase/tests/dcc_owner_passport_revision_cas.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/dcc_founder_identity_review.sql
          python3 -m venv "$RUNNER_TEMP/dcc-sql"
          "$RUNNER_TEMP/dcc-sql/bin/pip" install 'psycopg[binary]==3.2.13'
          "$RUNNER_TEMP/dcc-sql/bin/python" supabase/tests/dcc_concurrency.py

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Secret scan
        run: npm run secret-scan

      - name: Run type check
        run: npm run type-check
        env:
          # This repository's TS program exceeds Node 18's ~2 GiB default V8 heap.
          # Keep strict checking enabled; do not suppress diagnostics.
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Run linting
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Memory Agent golden eval (optional)
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "Optional Memory Agent golden eval skipped (no API key)"
            exit 0
          fi
          npm run eval:memory-agent -- --org=dcc
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
