name: CI

on:
  push:
    branches: [main, develop, 'career/**']
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Secret scan
        run: npm run secret-scan

      - name: Run type check
        run: npm run type-check
        env:
          # This repository's TS program exceeds Node 18's ~2 GiB default V8 heap.
          # Keep strict checking enabled; do not suppress diagnostics.
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Run linting
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Memory Agent golden eval (optional)
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "Optional Memory Agent golden eval skipped (no API key)"
            exit 0
          fi
          npm run eval:memory-agent -- --org=dcc
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Build application
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          # Next 14 uses this to size its static page worker pool.
          CIRCLE_NODE_TOTAL: '2'
          NEXT_TELEMETRY_DISABLED: '1'
          # Compile with offline fixtures. Provider integration runs in protected preview.
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsucHJldmlldy5leGFtcGxlJA
          CLERK_SECRET_KEY: local-dummy
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:65432
          NEXT_PUBLIC_SUPABASE_ANON_KEY: local-placeholder
          SUPABASE_SERVICE_ROLE_KEY: local-placeholder
          RESEND_API_KEY: re_local_only
